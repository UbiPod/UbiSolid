# Adds the real OneDrive provider to the local test stack. ONEDRIVE_* come from deploy/.env.
#   docker compose -f deploy/compose.test.yaml -f deploy/compose.test.onedrive.yaml up -d
# Register http://localhost:3998/.account/storage/callback/ as a Web redirect URI, then browse
# through an SSH tunnel: ssh -L 3998:localhost:3998 <host>
services:
  broker:
    environment:
      ONEDRIVE_CLIENT_ID: ${ONEDRIVE_CLIENT_ID:?set in deploy/.env}
      ONEDRIVE_CLIENT_SECRET: ${ONEDRIVE_CLIENT_SECRET:?set in deploy/.env}
      ONEDRIVE_TENANT: ${ONEDRIVE_TENANT:-common}
    # Keep links and accounts across restarts while testing with a real account.
    tmpfs: !reset []
    volumes: ["onedrive-broker:/data"]
  css:
    environment:
      # Data persists here, so single-use codes run out: E2E_CODES=E2E-CODE-0001,E2E-CODE-0002 bun test/e2e.ts
      INVITES_SEED_CODES: SEED-TEST-CODE-0001,SEED-TEST-CODE-0002,SEED-TEST-CODE-0003,E2E-CODE-0001,E2E-CODE-0002,E2E-CODE-0003,E2E-CODE-0004,E2E-CODE-0005,E2E-CODE-0006,E2E-CODE-0007,E2E-CODE-0008,E2E-CODE-0009,E2E-CODE-0010,E2E-CODE-0011,E2E-CODE-0012,E2E-CODE-0013,E2E-CODE-0014,E2E-CODE-0015,E2E-CODE-0016,E2E-CODE-0017,E2E-CODE-0018,E2E-CODE-0019,E2E-CODE-0020,USER-CODE-0001,USER-CODE-0002,USER-CODE-0003,USER-CODE-0004,USER-CODE-0005
    tmpfs: !reset []
    volumes: ["onedrive-css:/data"]
volumes:
  onedrive-broker:
  onedrive-css:
